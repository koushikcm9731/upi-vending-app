<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard — Vending Machine</title>
<style>
  :root {
    --bg: #0b0c10;
    --panel: #17181d;
    --line: #2a2c33;
    --ink: #eef0f3;
    --dim: #9aa0ab;
    --accent: #f5c542;
    --green: #35d07f;
    --red: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, sans-serif;
    padding: 32px 24px 80px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .updated { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  .refresh {
    background: var(--accent);
    color: #1a1400;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 24px;
  }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
  .stat .value { font-size: 24px; font-weight: 700; margin-top: 4px; font-family: monospace; }
  .stat .value.revenue { color: var(--green); }
  .stat .value.count { color: var(--accent); }
  section { margin-bottom: 28px; }
  h2 { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
  th { text-align: left; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); padding: 10px 14px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
  tr:last-child td { border-bottom: none; }
  .empty { padding: 14px; color: var(--dim); background: var(--panel); border-radius: 10px; font-size: 14px; }
  .status-tag { background: #2a2c33; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
  .status-tag.paid, .status-tag.dispensed { color: var(--green); }
  .restock-cell { display: flex; align-items: center; gap: 8px; }
  .restock-cell input {
    width: 60px;
    background: #0b0c10;
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 13px;
  }
  .restock-cell button {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .restock-cell button:hover { background: var(--accent); color: #1a1400; }
  .restock-msg { font-size: 11px; color: var(--dim); margin-left: 4px; }
  .login { max-width: 320px; margin: 80px auto; text-align: center; }
  .login input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); margin-bottom: 10px; }
  .login button { width: 100%; padding: 10px; border-radius: 8px; border: none; background: var(--accent); color: #1a1400; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<div id="loginScreen" class="login" style="display:none">
  <h1>Admin Login</h1>
  <input id="keyInput" type="password" placeholder="Admin key" />
  <button id="loginBtn">Enter</button>
</div>

<div id="dashboard" class="wrap" style="display:none">
  <h1>Vending Machine — Sales Dashboard</h1>
  <div class="updated" id="updatedAt">Last updated: —</div>
  <button class="refresh" id="refreshBtn">Refresh Now</button>

  <div class="stats">
    <div class="stat"><div class="label">Total Revenue</div><div class="value revenue" id="totalRevenue">₹0</div></div>
    <div class="stat"><div class="label">Total Orders</div><div class="value count" id="totalOrders">0</div></div>
    <div class="stat"><div class="label">Dispensed</div><div class="value count" id="dispensedOrders">0</div></div>
    <div class="stat"><div class="label">Pending</div><div class="value count" id="pendingOrders">0</div></div>
  </div>

  <section>
    <h2>Current Stock</h2>
    <table>
      <thead><tr><th>Product</th><th>Stock Left</th><th>Restock</th></tr></thead>
      <tbody id="stockBody"></tbody>
    </table>
  </section>

  <section>
    <h2>Sales By Product</h2>
    <div id="salesBody" class="empty">No sales yet</div>
  </section>

  <section>
    <h2>Recent Orders</h2>
    <div id="ordersWrap" class="empty">No orders yet</div>
  </section>
</div>

<script>
  const params = new URLSearchParams(location.search);
  let adminKey = params.get("key") || sessionStorage.getItem("adminKey") || "";

  const loginScreen = document.getElementById("loginScreen");
  const dashboard = document.getElementById("dashboard");

  function showDashboard() {
    loginScreen.style.display = "none";
    dashboard.style.display = "block";
    loadAll();
  }

  if (adminKey) {
    sessionStorage.setItem("adminKey", adminKey);
    showDashboard();
  } else {
    loginScreen.style.display = "block";
  }

  document.getElementById("loginBtn").addEventListener("click", () => {
    adminKey = document.getElementById("keyInput").value.trim();
    if (!adminKey) return;
    sessionStorage.setItem("adminKey", adminKey);
    showDashboard();
  });

  document.getElementById("refreshBtn").addEventListener("click", loadAll);

  async function loadAll() {
    await Promise.all([loadSummary(), loadOrders()]);
    document.getElementById("updatedAt").textContent = "Last updated: " + new Date().toLocaleTimeString();
  }

  async function loadSummary() {
    const res = await fetch(`/api/admin/summary?key=${encodeURIComponent(adminKey)}`);
    if (res.status === 401) { sessionStorage.removeItem("adminKey"); location.reload(); return; }
    const data = await res.json();

    document.getElementById("totalRevenue").textContent = "₹" + data.totalRevenue;
    document.getElementById("totalOrders").textContent = data.totalOrders;
    document.getElementById("dispensedOrders").textContent = data.dispensedOrders;
    document.getElementById("pendingOrders").textContent = data.pendingOrders;

    const stockBody = document.getElementById("stockBody");
    stockBody.innerHTML = "";
    data.currentStock.forEach((p) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${p.name}</td>
        <td>${p.stock}</td>
        <td>
          <div class="restock-cell">
            <input type="number" min="0" placeholder="${p.stock}" data-product="${p.id}" />
            <button data-product="${p.id}">Update</button>
            <span class="restock-msg" data-msg="${p.id}"></span>
          </div>
        </td>`;
      stockBody.appendChild(tr);
    });
    stockBody.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => restock(btn.dataset.product));
    });

    const salesBody = document.getElementById("salesBody");
    if (!data.perProduct || data.perProduct.length === 0) {
      salesBody.className = "empty";
      salesBody.textContent = "No sales yet";
    } else {
      salesBody.className = "";
      const table = document.createElement("table");
      table.innerHTML = `<thead><tr><th>Product</th><th>Qty Sold</th><th>Revenue</th></tr></thead>
        <tbody>${data.perProduct.map((p) => `<tr><td>${p.name}</td><td>${p.qtySold}</td><td>₹${p.revenue}</td></tr>`).join("")}</tbody>`;
      salesBody.replaceWith(table);
      table.id = "salesBody";
    }
  }

  async function restock(productId) {
    const input = document.querySelector(`input[data-product="${productId}"]`);
    const msg = document.querySelector(`span[data-msg="${productId}"]`);
    const newStock = input.value.trim();
    if (newStock === "") { msg.textContent = "Enter a number"; return; }
    msg.textContent = "Saving...";
    try {
      const res = await fetch(`/api/admin/restock?key=${encodeURIComponent(adminKey)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ productId, stock: Number(newStock) }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed");
      msg.textContent = "Updated ✓";
      input.value = "";
      loadSummary();
    } catch (e) {
      msg.textContent = e.message;
    }
  }

  async function loadOrders() {
    const res = await fetch(`/api/admin/orders?key=${encodeURIComponent(adminKey)}`);
    if (res.status === 401) return;
    const orders = await res.json();
    const wrap = document.getElementById("ordersWrap");
    if (!orders || orders.length === 0) {
      wrap.className = "empty";
      wrap.textContent = "No orders yet";
      return;
    }
    wrap.className = "";
    const table = document.createElement("table");
    table.innerHTML = `<thead><tr><th>Order</th><th>Items</th><th>Amount</th><th>Status</th><th>Time</th></tr></thead>
      <tbody>${orders.slice(0, 20).map((o) => `
        <tr>
          <td>${o.orderId.slice(0, 10)}...</td>
          <td>${o.items.map((i) => `${i.qty}x ${i.name}`).join(", ")}</td>
          <td>₹${o.amount}</td>
          <td><span class="status-tag ${o.status}">${o.status}</span></td>
          <td>${new Date(o.createdAt).toLocaleString()}</td>
        </tr>`).join("")}</tbody>`;
    wrap.replaceWith(table);
    table.id = "ordersWrap";
  }
</script>
</body>
</html>
