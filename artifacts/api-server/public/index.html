<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Snack Machine — Select &amp; Pay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16181c;
    --panel: #212429;
    --panel-raised: #262a30;
    --line: #34383f;
    --ink: #edeef0;
    --ink-dim: #8b9099;
    --hazard: #f5c328;
    --led: #ff4433;
    --led-glow: rgba(255, 68, 51, 0.45);
    --ok: #35d07f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,0.02), transparent 40%);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px 120px;
  }

  .machine {
    width: 100%;
    max-width: 460px;
  }

  /* ---- hazard header strip, like the branding band on a real machine ---- */
  .hazard-strip {
    height: 10px;
    border-radius: 6px 6px 0 0;
    background: repeating-linear-gradient(
      135deg, var(--hazard), var(--hazard) 10px, #1a1a1a 10px, #1a1a1a 20px
    );
  }

  header {
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-top: none;
    padding: 18px 20px 16px;
    border-radius: 0 0 10px 10px;
    margin-bottom: 18px;
  }

  header .eyebrow {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }

  header h1 {
    margin: 4px 0 0;
    font-size: 22px;
    font-weight: 700;
  }

  /* ---- LED-style total display, the signature element ---- */
  .display-panel {
    background: #0d0f12;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 20px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
  }

  .display-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'Share Tech Mono', monospace;
  }

  .display-row .label {
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }

  .display-row .amount {
    font-size: 30px;
    color: var(--led);
    text-shadow: 0 0 10px var(--led-glow), 0 0 2px var(--led-glow);
    transition: opacity 0.15s ease;
  }

  .selected-name {
    margin-top: 6px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--ink-dim);
    min-height: 16px;
  }

  /* ---- product grid ---- */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }

  .product {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    text-align: left;
    color: var(--ink);
    transition: border-color 0.15s ease, background 0.15s ease;
    position: relative;
  }

  .product.in-cart {
    border-color: var(--hazard);
    background: var(--panel-raised);
  }

  .product .slot-tag {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.08em;
  }

  .product .name {
    font-weight: 600;
    font-size: 15px;
    margin: 6px 0 4px;
  }

  .product .price {
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    color: var(--hazard);
  }

  .product .stock {
    margin-top: 6px;
    font-size: 11px;
    color: var(--ink-dim);
  }

  .product.out-of-stock {
    opacity: 0.4;
  }

  .product .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ok);
  }

  .product.out-of-stock .badge { background: #6a6f78; }

  /* ---- quantity stepper ---- */
  .stepper {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .stepper button {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-raised);
    color: var(--ink);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    line-height: 1;
  }

  .stepper button:hover { border-color: var(--hazard); }
  .stepper button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .stepper .qty {
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    min-width: 18px;
    text-align: center;
  }

  /* ---- pay button ---- */
  .pay-btn {
    width: 100%;
    padding: 16px;
    border-radius: 10px;
    border: none;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.02em;
    background: var(--hazard);
    color: #17181a;
    cursor: pointer;
    transition: filter 0.15s ease, opacity 0.15s ease;
  }

  .pay-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .pay-btn:not(:disabled):hover { filter: brightness(1.06); }

  .status-line {
    text-align: center;
    margin-top: 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--ink-dim);
    min-height: 16px;
  }

  .status-line.error { color: var(--led); }
</style>
</head>
<body>

  <div class="machine">
    <div class="hazard-strip"></div>
    <header>
      <div class="eyebrow">Machine 01 · Online</div>
      <h1>Pick a Snack From SIT Vending Machine</h1>
    </header>

    <div class="display-panel">
      <div class="display-row">
        <span class="label">Total</span>
        <span class="amount" id="totalAmount">₹00</span>
      </div>
      <div class="selected-name" id="selectedName">No item selected</div>
    </div>

    <div class="grid" id="productGrid">
      <!-- product cards injected by JS -->
    </div>

    <button class="pay-btn" id="payBtn" disabled>Select an item to pay</button>
    <div class="status-line" id="statusLine"></div>
  </div>

<script>
  // Point this at wherever you deploy backend/server.js
  const API_BASE = "";
  const MACHINE_ID = "machine-01";

  let allProducts = [];
  const cart = {}; // productId -> qty

  const grid = document.getElementById("productGrid");
  const totalAmountEl = document.getElementById("totalAmount");
  const selectedNameEl = document.getElementById("selectedName");
  const payBtn = document.getElementById("payBtn");
  const statusLine = document.getElementById("statusLine");

  async function loadProducts() {
    statusLine.textContent = "Loading menu...";
    try {
      const res = await fetch(`${API_BASE}/api/products`);
      allProducts = await res.json();
      renderProducts();
      updateSummary();
      statusLine.textContent = "";
    } catch (e) {
      statusLine.textContent = "Could not reach the machine. Check your connection.";
      statusLine.classList.add("error");
    }
  }

  function renderProducts() {
    grid.innerHTML = "";
    allProducts.forEach((p, i) => {
      const outOfStock = p.stock <= 0;
      const qty = cart[p.id] || 0;

      const card = document.createElement("div");
      card.className = "product" + (outOfStock ? " out-of-stock" : "") + (qty > 0 ? " in-cart" : "");
      card.innerHTML = `
        <span class="badge"></span>
        <div class="slot-tag">SLOT ${i + 1}</div>
        <div class="name">${p.name}</div>
        <div class="price">₹${p.price}</div>
        <div class="stock">${outOfStock ? "Sold out" : p.stock + " left"}</div>
        <div class="stepper">
          <button type="button" class="minus" ${qty === 0 ? "disabled" : ""}>−</button>
          <span class="qty">${qty}</span>
          <button type="button" class="plus" ${outOfStock || qty >= p.stock ? "disabled" : ""}>+</button>
        </div>
      `;
      card.querySelector(".minus").addEventListener("click", () => changeQty(p, -1));
      card.querySelector(".plus").addEventListener("click", () => changeQty(p, 1));
      grid.appendChild(card);
    });
  }

  function changeQty(product, delta) {
    const current = cart[product.id] || 0;
    const next = Math.max(0, Math.min(product.stock, current + delta));
    if (next === 0) delete cart[product.id];
    else cart[product.id] = next;

    renderProducts();
    updateSummary();
  }

  function updateSummary() {
    const lines = Object.entries(cart).map(([id, qty]) => {
      const p = allProducts.find((x) => x.id === id);
      return { ...p, qty };
    });

    const total = lines.reduce((sum, l) => sum + l.price * l.qty, 0);
    totalAmountEl.textContent = `₹${String(total).padStart(2, "0")}`;

    if (lines.length === 0) {
      selectedNameEl.textContent = "No item selected";
      payBtn.disabled = true;
      payBtn.textContent = "Select an item to pay";
    } else {
      selectedNameEl.textContent = lines.map((l) => `${l.qty}x ${l.name}`).join(", ");
      payBtn.disabled = false;
      payBtn.textContent = `Pay ₹${total} with UPI`;
    }

    statusLine.textContent = "";
    statusLine.classList.remove("error");
  }

  payBtn.addEventListener("click", async () => {
    const items = Object.entries(cart).map(([productId, qty]) => ({ productId, qty }));
    if (items.length === 0) return;

    payBtn.disabled = true;
    payBtn.textContent = "Starting payment...";
    statusLine.textContent = "";

    try {
      const res = await fetch(`${API_BASE}/api/create-order`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items, machineId: MACHINE_ID }),
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || "Could not start payment");

      // Send the customer to the status page, which now opens Razorpay's
      // real Checkout (verified merchant flow) instead of a raw UPI link.
      const params = new URLSearchParams({
        txn: data.orderId,
        amount: data.amount,
        rzpOrderId: data.razorpayOrderId,
        rzpKeyId: data.razorpayKeyId,
      });
       window.location.href = `/status?${params.toString()}`;
    } catch (e) {
      statusLine.textContent = e.message;
      statusLine.classList.add("error");
      payBtn.disabled = false;
      updateSummary();
    }
  });

  loadProducts();
</script>

</body>
</html>
