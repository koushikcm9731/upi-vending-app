<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment status — SIT Vending Machine</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1730;--panel:#122348;--line:#29436f;--ink:#eef5ff;--dim:#a9b9d4;--blue:#3d9bff;--cyan:#67e8f9;--green:#45d6a3;--red:#ff6b6b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif;display:grid;place-items:center;padding:20px}
    main{width:min(100%,440px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px;text-align:center}
    .mark{font-size:44px;margin-bottom:10px}.eyebrow{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
    h1{margin:8px 0;font-size:25px}.detail{color:var(--dim);line-height:1.5;margin:10px 0 24px}
    button{width:100%;border:0;border-radius:10px;padding:15px;background:var(--blue);color:#061126;font-weight:700;font-size:16px;cursor:pointer;margin-top:10px}
    button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}#message{min-height:24px;color:var(--dim)}
    .error{color:var(--red)!important}.done{color:var(--green)!important}
  </style>
</head>
<body><main>
  <div class="mark">◈</div><div class="eyebrow">SIT Vending Machine</div><h1 id="title">Ready for payment</h1>
  <div class="detail" id="detail"></div><div id="message"></div>
  <button id="pay">Open UPI app</button><button class="secondary" id="confirm">I've Paid</button>
</main>
<script>
  const params=new URLSearchParams(location.search), txn=params.get("txn"), upi=params.get("upi"), amount=params.get("amount");
  const title=document.getElementById("title"), detail=document.getElementById("detail"), message=document.getElementById("message");
  detail.textContent=txn?`Order ${txn} · ₹${amount||"0"}`:"No order selected";
  document.getElementById("pay").onclick=()=>{if(upi) location.href=upi};
  document.getElementById("confirm").onclick=async()=>{if(!txn)return;message.textContent="Confirming payment…";try{const r=await fetch("/api/confirm-payment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({orderId:txn})});const d=await r.json();if(!r.ok)throw Error(d.error);message.textContent="Payment received. Your snack is being prepared.";message.className="done";poll()}catch(e){message.textContent=e.message;message.className="error"}};
  async function poll(){const r=await fetch("/api/order-status/"+encodeURIComponent(txn));const d=await r.json();if(d.status==="dispensed"){title.textContent="Enjoy your snack";message.textContent="Dispensed successfully.";return}if(d.status==="paid"){title.textContent="Dispensing…";setTimeout(poll,3000)}}
</script>
</body></html>
